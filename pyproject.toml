[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "junos-switch-upgrader"
version = "0.3.0"
description = "Site-generic, topology-aware Juniper EX/QFX firmware upgrade orchestrator with unified HTTP+SCP staging, package validation, and hardware triage"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["juniper", "junos", "networking", "switches", "firmware", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]
dependencies = [
    "click>=8.1",
    "netmiko>=4.3",
    "paramiko>=3.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
junos-upgrader = "junos_upgrader.cli:main"

[project.urls]
Homepage = "https://github.com/leifdavisson/junos-switch-upgrader"
Repository = "https://github.com/leifdavisson/junos-switch-upgrader"
Issues = "https://github.com/leifdavisson/junos-switch-upgrader/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
junos_upgrader = ["data/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "PYI"]
ignore = ["PYI034"]
