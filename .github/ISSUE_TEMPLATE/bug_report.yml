name: Bug Report
description: Report a bug in junos-switch-upgrader
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > **OPSEC Reminder:** Do **NOT** paste real switch IPs, site names, hostnames, serial numbers, `credentials.json`, or raw `deliverables/` outputs.
        > Use `junos-upgrader topology --redact` and RFC 5737 documentation IPs (`192.0.2.x` / `198.51.100.x`).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Command run (with redacted targets) and relevant output or traceback.
    validations:
      required: true

  - type: input
    id: switch_model
    attributes:
      label: Switch model & Junos version
      placeholder: "e.g., EX2300-C-12P on 23.4R2.13 -> 23.4R2-S8"

  - type: input
    id: environment
    attributes:
      label: Runner OS & Python version
      placeholder: "e.g., Ubuntu 24.04 / Python 3.12 or Windows 11 / Python 3.12"
    validations:
      required: true
