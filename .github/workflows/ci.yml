name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-packaging:
    name: Lint, OPSEC & Wheel Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Verify bundled release manifest parity
        run: cmp -s manifests/approved-releases.yml src/junos_upgrader/data/approved-releases.yml

      - name: Run OPSEC hygiene tests
        run: pytest -v tests/test_opsec_hygiene.py

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify non-repo-root wheel installation
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --no-deps dist/*.whl
          /tmp/wheel-venv/bin/pip install click netmiko paramiko pyyaml rich
          cd /tmp
          /tmp/wheel-venv/bin/junos-upgrader --help
          /tmp/wheel-venv/bin/python -c "from junos_upgrader.cli import resolve_default_releases_path; p = resolve_default_releases_path(); assert p.is_file(), p; print('Resolved:', p)"

  powershell-check:
    name: PowerShell Syntax & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Parse PowerShell AST
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "setup-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "setup-windows.ps1 AST parsed cleanly."

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          $findings = Invoke-ScriptAnalyzer -Path "setup-windows.ps1" -Severity Error
          if ($findings) {
            $findings | Format-Table -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer passed with 0 errors."

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint-and-packaging
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: pytest -v --cov=junos_upgrader --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
